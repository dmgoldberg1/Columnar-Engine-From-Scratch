services:
  benchmark-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: columnar-benchmark-service:dev
    user: "${BENCHMARK_UID:-1000}:${BENCHMARK_GID:-1000}"
    environment:
      BENCHMARK_HOST: 0.0.0.0
      BENCHMARK_PORT: 8080
      BENCHMARK_DATA_DIR: /data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./datasets
        target: /data

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ./monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./monitoring/grafana/provisioning/datasources/prometheus.yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
        read_only: true
      - type: volume
        source: grafana-data
        target: /var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
