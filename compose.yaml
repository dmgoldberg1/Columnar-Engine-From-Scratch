services:
  benchmark-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: columnar-benchmark-service:dev
    user: "${BENCHMARK_UID:-1000}:${BENCHMARK_GID:-1000}"
    environment:
      BENCHMARK_HOST: 0.0.0.0
      BENCHMARK_PORT: 8080
      BENCHMARK_DATA_DIR: /data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./datasets
        target: /data

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ./monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus

volumes:
  prometheus-data:
