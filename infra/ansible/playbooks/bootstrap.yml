---
- name: Prepare the benchmark VM
  hosts: benchmark
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker Engine and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-buildx
          - docker-compose-v2
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start the Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Read the Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false
      when: not ansible_check_mode

    - name: Read the Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false
      when: not ansible_check_mode

    - name: Show the installed Docker versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ docker_compose_version.stdout }}"
      when: not ansible_check_mode
